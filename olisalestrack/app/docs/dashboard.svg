      <stop offset="0%" stop-color="#1a1f4a"/>
      <stop offset="100%" stop-color="#07091a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" x2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="profit" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#0e9f6e"/>
    </linearGradient>
    <linearGradient id="sales" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>

