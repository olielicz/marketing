    <text x="38" y="158" fill="rgba(255,255,255,0.7)">↺ Refunds</text>
    <text x="38" y="195" fill="rgba(255,255,255,0.7)">$ Sales</text>
    <text x="38" y="232" fill="rgba(255,255,255,0.7)">▼ Expenses</text>
    <text x="38" y="269" fill="rgba(255,255,255,0.7)">⚖ Disputes</text>
    <text x="38" y="306" fill="rgba(255,255,255,0.7)">⇪ Import</text>
    <text x="38" y="343" fill="rgba(255,255,255,0.7)">⚙ Settings</text>
