                  <li>✅ Correlation analysis (Pearson r)</li>
                  <li>✅ AI-generated insights (optional AI key, real fallback)</li>
                  <li>✅ PDF report export</li>
                  <li>✅ Multiple business profiles</li>
                  <li>✅ Sales, refunds &amp; expense tracking</li>
                  <li>✅ Live sync from Stripe/PayPal/Shopify</li>
                  <li>✅ CSV import (Shopify/WooCommerce/Stripe)</li>
                  <li>✅ Dispute portal quick-links (10 providers)</li>
                </ul>
                <${Button} as="a" href="../buy/" tone="primary" className="w-full justify-center">Manage Subscription →<//>
              </div>
              <p class="text-xs text-white/40 mt-4">Not subscribed yet, or need to change your plan? <a href="../buy/" class="text-cyan2 underline">See pricing →</a></p>
            </div>
          <//>
        </div>`;
    }

    /* ===================================================================
     * Layout / shell
     * ================================================================= */

    const NAV = [
      { id: 'dashboard',    label: 'Dashboard',    icon: '⌂' },
      { id: 'correlations', label: 'Correlations', icon: '🔗' },
      { id: 'refunds',      label: 'Refunds',      icon: '↺' },
      { id: 'sales',        label: 'Sales',        icon: '$' },
      { id: 'expenses',     label: 'Expenses',     icon: '▼' },
      { id: 'disputes',     label: 'Disputes',     icon: '⚖' },
      { id: 'import',       label: 'Import',       icon: '⇪' },
      { id: 'upgrade',      label: 'Upgrade',      icon: '⭐' },
      { id: 'settings',     label: 'Settings',     icon: '⚙' },
    ];

    /* Compact profile switcher shown in the sidebar — real, separate
     * datasets per business (see the "Multiple business profiles"
     * section near STORAGE_KEY above), not a fake dropdown of one item. */
    function ProfileSwitcher({ profiles, onSwitchProfile, compact }) {
      const active = profiles.profiles.find(p => p.id === profiles.activeId) || profiles.profiles[0];
      if (profiles.profiles.length <= 1) {
        return compact ? null : html`<div class="text-[10px] uppercase tracking-[0.18em] text-white/40">${active.name}</div>`;
      }
      return html`
        <${Select} value=${profiles.activeId} onChange=${onSwitchProfile}
          className=${compact ? 'text-xs py-1' : 'text-xs'}>
          ${profiles.profiles.map(p => html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}
        <//>`;
    }

    function Sidebar({ page, onNavigate, profiles, onSwitchProfile }) {
      return html`
        <aside class="hidden md:flex flex-col w-56 shrink-0 border-r border-white/5 bg-ink-950/80 glass">
          <div class="p-5 flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-brand to-cyan2 flex items-center justify-center font-bold text-white text-sm">$↺</div>
            <div class="min-w-0 flex-1">
              <div class="text-sm font-bold tracking-wide">OliSalesTrack</div>
              ${profiles
                ? html`<div class="mt-1"><${ProfileSwitcher} profiles=${profiles} onSwitchProfile=${onSwitchProfile}/></div>`
                : html`<div class="text-[10px] uppercase tracking-[0.18em] text-white/40">v2 · local</div>`}
            </div>
          </div>
          <nav class="px-3 pb-3 space-y-1">
            ${NAV.map(n => html`
              <button key=${n.id} onClick=${() => onNavigate(n.id)} class=${cls('w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition',
                  page === n.id ? 'bg-brand/15 text-white border border-brand/30' : 'text-white/70 hover:bg-white/5')}>
                <span class="w-5 text-center text-base">${n.icon}</span><span>${n.label}</span>
              </button>`)}
          </nav>
        </aside>`;
    }

    function MobileNav({ page, onNavigate }) {
      return html`
        <nav class="md:hidden fixed bottom-0 inset-x-0 z-30 border-t border-white/10 bg-ink-950/95 glass flex">
          ${NAV.slice(0, 6).map(n => html`
            <button key=${n.id} onClick=${() => onNavigate(n.id)} class=${cls('flex-1 py-2 flex flex-col items-center gap-1 text-[10px] uppercase tracking-[0.18em]',
                page === n.id ? 'text-white' : 'text-white/50')}>
              <span class="text-base">${n.icon}</span><span>${n.label}</span>
            </button>`)}
        </nav>`;
    }

    function TopBar({ page, month, setMonth, currency, profiles, onSwitchProfile }) {
      const titles = NAV.reduce((m, n) => (m[n.id] = n.label, m), {});
      return html`
        <header class="flex items-center gap-3 px-4 sm:px-6 py-3 border-b border-white/5 bg-ink-950/60 glass">
          <h1 class="text-lg font-bold tracking-tight">${titles[page] || ''}</h1>
          ${profiles && profiles.profiles.length > 1 && html`
            <div class="md:hidden"><${ProfileSwitcher} profiles=${profiles} onSwitchProfile=${onSwitchProfile} compact/></div>`}
          <div class="ml-auto flex items-center gap-2">
            <${Input} type="month" value=${month} onInput=${setMonth} className="w-44"/>
            <span class="text-xs text-white/40 hidden sm:inline">${currency}</span>
          </div>
        </header>`;
    }

    /* ===================================================================
     * App root
     * ================================================================= */

    function App() {
      const [profiles, setProfiles] = useState(loadProfiles);
      const profile = useMemo(() => profiles.profiles.find(p => p.id === profiles.activeId) || profiles.profiles[0], [profiles]);
      const storageKey = storageKeyForProfile(profile);

      // Real, separate dataset per business profile: re-seeding the
      // reducer's initial state whenever the active profile changes
      // (switching profiles), keyed by that profile's own storageKey —
      // NOT shared with any other profile.
      const [state, dispatch] = useReducer(reducer, storageKey, loadState);
      useEffect(() => { saveState(state, storageKey); }, [state, storageKey]);
      // When the active profile changes, load ITS data instead of
      // continuing to show/mutate the previous profile's in-memory state.
      useEffect(() => { dispatch({ type: 'init', state: loadState(storageKey) }); }, [storageKey]);

      function onSwitchProfile(id) { setProfiles(switchProfile(id)); }
      function onCreateProfile(name) { setProfiles(createProfile(name)); }
      function onRenameProfile(id, name) { setProfiles(renameProfile(id, name)); }
      function onDeleteProfile(id) { setProfiles(deleteProfile(id)); }

      const initialHash = (location.hash || '#dashboard').slice(1);
      const [page, setPageRaw] = useState(initialHash.split('?')[0] || 'dashboard');
      const [requestAdd, setRequestAdd] = useState(0);

      const setPage = (p) => {
        setPageRaw(p);
        history.replaceState(null, '', '#' + p);
      };

      // Honor #refunds?add=1 etc. from manifest shortcuts
      useEffect(() => {
        const raw = (location.hash || '').slice(1);
        const [p, q] = raw.split('?');
        if (p) setPageRaw(p);
        if (q && q.includes('add=1')) setRequestAdd(x => x + 1);
        const onHash = () => {
          const h = (location.hash || '').slice(1);
          const [pp, qq] = h.split('?');
          if (pp) setPageRaw(pp);
          if (qq && qq.includes('add=1')) setRequestAdd(x => x + 1);
        };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const [month, setMonth] = useState(todayISO().slice(0, 7));

      // PWA install prompt capture
      const [installPrompt, setInstallPrompt] = useState(null);
      useEffect(() => {
        const onBeforeInstall = (e) => { e.preventDefault(); setInstallPrompt(e); };
        window.addEventListener('beforeinstallprompt', onBeforeInstall);
        return () => window.removeEventListener('beforeinstallprompt', onBeforeInstall);
      }, []);
      const installable = !!installPrompt;
      const onInstall = async () => {
        if (!installPrompt) return;
        installPrompt.prompt();
        await installPrompt.userChoice;
        setInstallPrompt(null);
      };

      const cur = state.settings.currency;
      const consumeRequestAdd = page; // re-trigger requestAdd whenever page changes

      let body;
      switch (page) {
        case 'correlations': body = html`<${CorrelationsPage} state=${state} month=${month}/>`; break;
        case 'refunds':  body = html`<${RefundsPage}  state=${state} dispatch=${dispatch} month=${month} requestAdd=${requestAdd}/>`; break;
        case 'sales':    body = html`<${SalesPage}    state=${state} dispatch=${dispatch} month=${month} requestAdd=${requestAdd}/>`; break;
        case 'expenses': body = html`<${ExpensesPage} state=${state} dispatch=${dispatch} month=${month} requestAdd=${requestAdd}/>`; break;
        case 'disputes': body = html`<${DisputesPage} state=${state}/>`; break;
        case 'import':   body = html`<${ImportPage}   state=${state} dispatch=${dispatch}/>`; break;
        case 'upgrade':  body = html`<${UpgradePage}/>`; break;
        case 'settings': body = html`<${SettingsPage} state=${state} dispatch=${dispatch} installable=${installable} onInstall=${onInstall}
          profiles=${profiles} activeProfile=${profile}
          onSwitchProfile=${onSwitchProfile} onCreateProfile=${onCreateProfile}
          onRenameProfile=${onRenameProfile} onDeleteProfile=${onDeleteProfile}/>`; break;
        default:         body = html`<${Dashboard}    state=${state} dispatch=${dispatch} month=${month} setMonth=${setMonth}/>`;
      }

      return html`
        <div class="h-full flex">
          <${Sidebar} page=${page} onNavigate=${setPage} profiles=${profiles} onSwitchProfile=${onSwitchProfile}/>
          <div class="flex-1 flex flex-col min-w-0">
            <${TopBar} page=${page} month=${month} setMonth=${setMonth} currency=${cur} profiles=${profiles} onSwitchProfile=${onSwitchProfile}/>
            <main class="flex-1 overflow-auto scroll-thin px-4 sm:px-6 py-5 pb-24 md:pb-5">${body}</main>
          </div>
          <${MobileNav} page=${page} onNavigate=${setPage}/>
        </div>`;
    }

    /* ===================================================================
     * Bootstrap + service worker
     * ================================================================= */

    try {
      const root = ReactDOM.createRoot(document.getElementById('app'));
      root.render(html`<${App}/>`);
    } catch (err) {
      document.getElementById('boot-error-msg').textContent = err.stack || String(err);
      document.getElementById('boot-error').style.display = 'block';
      throw err;
    }

    if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
      navigator.serviceWorker.register('./sw.js').catch((err) => console.warn('SW registration failed', err));
    }
    </script>
  </body>
</html>
