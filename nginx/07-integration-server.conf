# integration-server — reverse proxy to the Node service on 127.0.0.1:3000.
# This is what Zapier/Make/n8n/GHL will call, so it needs a real, stable
# HTTPS URL once you register OAuth apps with those platforms.
# Replace yourdomain.com with your real domain before copying into
# /etc/nginx/sites-available/.

server {
    listen 80;
    listen [::]:80;
    server_name integrations.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
