# oliflow-executor — reverse proxy to the Node service on 127.0.0.1:4400.
# Replace yourdomain.com with your real domain before copying into
# /etc/nginx/sites-available/.

server {
    listen 80;
    listen [::]:80;
    server_name flow-executor.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Workflow runs (http_request nodes, SMTP sends) can take longer
        # than nginx's default 60s proxy timeout — extend it.
        proxy_read_timeout 120s;
    }
}
