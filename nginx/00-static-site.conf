# Marketing site + all 6 tools' login/account/landing pages — plain static
# files, served directly by nginx (no Node process needed for this part).
# Replace yourdomain.com with your real domain before copying into
# /etc/nginx/sites-available/ (see DEPLOY-HOSTINGER-VPS.md step 8).

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    root /home/oli/oli-marketing;
    index index.html;

    # Let certbot's --nginx plugin add the HTTPS server block and the
    # redirect from :80 to :443 automatically (step 9) — don't hand-add
    # a redirect here or certbot's edit may conflict with it.

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Never let login/account pages get cached or indexed at the HTTP layer
    # (the pages themselves already set meta robots noindex — this backs
    # it up at the server level too).
    location ~ ^/(login|account)(/|$) {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ $uri.html =404;
    }

    location ~ /\.(git|env)($|/) {
        deny all;
    }
}
