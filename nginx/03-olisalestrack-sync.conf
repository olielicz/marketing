# olisalestrack-sync — reverse proxy to the Node service on 127.0.0.1:4200.
# Stripe/PayPal/Shopify will POST webhooks to this host, so this needs a
# real, stable HTTPS URL registered with each provider once live.
# Replace yourdomain.com with your real domain before copying into
# /etc/nginx/sites-available/.

server {
    listen 80;
    listen [::]:80;
    server_name salestrack-sync.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Webhook bodies must reach the app UNMODIFIED for signature
        # verification (Stripe/Shopify/PayPal all sign the raw body) —
        # nginx's default proxy_pass does not alter the body, so no
        # special buffering directives are needed here, but avoid adding
        # any request-rewriting modules/directives to this location block.
    }
}
